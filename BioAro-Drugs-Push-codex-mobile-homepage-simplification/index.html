<!doctype html>

    <!-- Without these the typefaces are only discovered after the CSS parses, which
         means a system-sans first paint on every cold load. Only the latin subsets
         are preloaded: latin-ext is gated behind its unicode-range and would be a
         wasted fetch on English content. -->
    <link rel="preload" href="./src/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
